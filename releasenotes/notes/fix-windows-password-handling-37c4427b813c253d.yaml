---
fixes:
  - |
    Fix Windows instance password handling. Previously, ``adminPass`` was
    hashed with SHA-512-crypt before being sent to Nova, which is incorrect
    for QEMU Guest Agent and Config Drive delivery. The hashing belongs only
    in ``getUserData()`` for cloud-init's ``chpasswd --encrypted``.

    Additionally, ``metadata.admin_pass`` is now set so that cloudbase-init
    can retrieve the password via the HTTP metadata service. Without this,
    Windows instances could not set the admin password unless a Config Drive
    was attached, since Nova only exposes ``adminPass`` via Config Drive.

    Linux ``user_data`` generation (``chpasswd``) is now skipped for Windows
    images, as cloudbase-init cannot use ``chpasswd``. Custom ``user_data``
    (e.g. PowerShell scripts) is passed through as-is.
    `LP #2164759 <https://bugs.launchpad.net/skyline-console/+bug/2164759>`__
